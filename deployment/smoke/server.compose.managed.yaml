# Smoke configuration for managed task-run inference.
#
# Tracks server.compose.yaml — keep the two in step; they differ only in the
# `llm` block and `worker.llm`. The split exists because transport is startup
# configuration, so one stack cannot run both modes, and both modes need
# end-to-end coverage.
#
# What this proves that the direct smoke does not: a worker completes a real
# task while holding no provider credential. The key reaches the server through
# BUILDMAX_CONVERSATION_MODEL_API_KEY and never reaches a worker, because
# `worker.llm.transport: buildmax` withholds it — and it is not in this file
# either, so a worker mounting this config cannot find it anywhere.

log_level: info
port: 5678
# cors_origin: from BUILDMAX_CORS_ORIGIN, derived from BUILDMAX_PORTAL_PORT in
# compose.yaml, so the smoke follows a moved Portal port like the stack does.
workspaces_dir: /data/workspaces
# The smoke deployment runs many agent runs and is meant to be kept: free_trial
# caps a space at ten runs in thirty days, which turns a long-lived local stack
# into a broken one after a handful of smokes. Quota behaviour is not what these
# suites verify.
default_quota_tier: pro
# The browser suite signs in once and replays that one saved session across every
# spec over the whole run; a suite-spanning grace lets it survive single-use
# refresh-token rotation. Test-only: the committed default stays 30s.
refresh_rotation_grace: 1h

database:
  host: mysql
  port: 3306
  user: buildmax
  name: buildmax

conversation:
  model:
    model: buildmax-smoke
    name: BuildMax smoke
    api_url: http://mock-llm:8080/v1
    context_window: 32000

# The model above is derived into a catalog target named after it, so this smoke
# needs no llm_model row and no ID to discover at deploy time. A real deployment
# names a row created with `buildmax-server model add` instead.
llm:
  default_model: BuildMax smoke

worker:
  binary: buildmax-worker
  run_mode: local_process
  server_url: http://127.0.0.1:5679
  llm:
    transport: buildmax
    # Left unset on purpose: a run then uses llm.default_model, which is the
    # path a deployment with one model takes.
    context_window: 32000
  run_token_ttl: 1h

storage:
  persist_backend: local_fs
  artifact_backend: local_fs
