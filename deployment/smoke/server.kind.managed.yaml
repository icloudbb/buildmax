# Smoke configuration for managed task-run inference on kind.
#
# Tracks server.kind.yaml — keep the two in step; they differ only in the `llm`
# block and `worker.llm`. The split exists because transport is startup
# configuration, so one server cannot serve both modes, and both modes need
# end-to-end coverage.
#
# What this proves that the compose managed smoke does not: the run token
# reaches a worker through a Kubernetes Job spec rather than a child process
# environment. Those are two different delivery paths for the same credential.
#
# The provider key reaches the server from buildmax-secret and is withheld from
# worker pods by `worker.llm.transport: buildmax`. It is not in this file
# either, so a worker pod mounting this ConfigMap cannot find it anywhere.

log_level: info
port: 5678
cors_origin: http://localhost:8080
workspaces_dir: /buildmax/workspaces
# The smoke deployment runs many agent runs and is meant to be kept: free_trial
# caps a space at ten runs in thirty days, which turns a long-lived local stack
# into a broken one after a handful of smokes. Quota behaviour is not what these
# suites verify.
default_quota_tier: pro
# The browser suite signs in once and replays that one saved session across every
# spec over the whole run; a suite-spanning grace lets it survive single-use
# refresh-token rotation. Test-only: the committed default stays 30s.
refresh_rotation_grace: 1h

# Two server replicas share live state through the in-cluster Redis. See
# docs/design/server-coordination.md.
coordination:
  mode: redis
  redis:
    address: buildmax-redis.buildmax.svc.cluster.local:6379

database:
  host: mysql.db.svc.cluster.local
  port: 3306
  user: buildmax
  name: buildmax

conversation:
  model:
    model: buildmax-smoke
    name: BuildMax smoke
    api_url: http://buildmax-smoke-llm.buildmax.svc.cluster.local:8080/v1
    context_window: 32000

# The model above is derived into a catalog target named after it, so this smoke
# needs no llm_model row and no ID to discover at deploy time. A real deployment
# names a row created with `buildmax-server model add` instead.
llm:
  default_model: BuildMax smoke

worker:
  binary: buildmax-worker
  run_mode: k8s_job
  # The internal worker Service, over HTTPS. Certificate and CA generated by
  # `./make kind up` (tools/mk/kind_tls.go).
  server_url: https://buildmax-worker-api.buildmax.svc.cluster.local:5679
  server_ca_file: /buildmax/tls/worker-api-ca.crt
  llm:
    transport: buildmax
    # Left unset on purpose: a run then uses llm.default_model, which is the
    # path a deployment with one model takes.
    context_window: 32000
  run_token_ttl: 1h
  k8s:
    namespace: buildmax
    image: buildmax:local
    config_map: buildmax-config
    ca_config_map: buildmax-worker-api-ca
    home_dir: /buildmax
    # Required in this run mode, and small enough to schedule on a single-node
    # kind cluster that is also running MySQL, MinIO, and the server.
    resources:
      cpu_request: 100m
      cpu_limit: "1"
      memory_request: 256Mi
      memory_limit: 1Gi
      ephemeral_storage_request: 256Mi
      ephemeral_storage_limit: 2Gi

# Bound to all interfaces so the buildmax-worker-api Service reaches the worker
# listener from a worker pod, over TLS. Cert mounted from buildmax-worker-api-tls.
worker_api:
  listen: 0.0.0.0:5679
  tls:
    cert_file: /buildmax/tls/worker-api/tls.crt
    key_file: /buildmax/tls/worker-api/tls.key

storage:
  persist_backend: minio
  artifact_backend: minio
  minio:
    endpoint: http://minio.storage.svc.cluster.local:9000
    region: us-east-1
    bucket: bmstore
    prefix: workspaces
