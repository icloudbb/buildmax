log_level: info
port: 5678
cors_origin: http://localhost:8080
# Single-origin ingress, so artifact share links are built from the same host
# the Portal and API are served on.
public_base_url: http://localhost:8080
workspaces_dir: /buildmax/workspaces
# The smoke deployment runs many agent runs and is meant to be kept: free_trial
# caps a space at ten runs in thirty days, which turns a long-lived local stack
# into a broken one after a handful of smokes. Quota behaviour is not what these
# suites verify.
default_quota_tier: pro
# The browser suite signs in once and replays that one saved session across every
# spec over the whole run. A refresh token is single-use and rotating, so a
# replay after the default 30s grace reads as reuse and revokes the session. A
# grace that spans a suite lets the shared session survive it. Test-only: the
# committed default stays 30s.
refresh_rotation_grace: 1h

# The kind deployment runs two server replicas, so live streaming, connection
# events, and conversation turn serialization are shared through the in-cluster
# Redis rather than held per process. See docs/design/server-coordination.md.
coordination:
  mode: redis
  redis:
    address: buildmax-redis.buildmax.svc.cluster.local:6379

database:
  host: mysql.db.svc.cluster.local
  port: 3306
  user: buildmax
  name: buildmax

conversation:
  model:
    model: buildmax-smoke
    name: BuildMax smoke
    api_url: http://buildmax-smoke-llm.buildmax.svc.cluster.local:8080/v1
    context_window: 32000

worker:
  binary: buildmax-worker
  run_mode: k8s_job
  # The internal worker Service, over HTTPS. The certificate and CA are
  # generated by `./make kind up` (see tools/mk/kind_tls.go); the worker
  # verifies the server against the CA below, which is mounted from
  # k8s.ca_config_map.
  server_url: https://buildmax-worker-api.buildmax.svc.cluster.local:5679
  server_ca_file: /buildmax/tls/worker-api-ca.crt
  k8s:
    namespace: buildmax
    image: buildmax:local
    config_map: buildmax-config
    ca_config_map: buildmax-worker-api-ca
    home_dir: /buildmax
    # Required in this run mode, and small enough to schedule on a single-node
    # kind cluster that is also running MySQL, MinIO, and the server.
    resources:
      cpu_request: 100m
      cpu_limit: "1"
      memory_request: 256Mi
      memory_limit: 1Gi
      ephemeral_storage_request: 256Mi
      ephemeral_storage_limit: 2Gi

# Bound to all interfaces so the buildmax-worker-api Service reaches the worker
# listener from a worker pod, over TLS. The cert is mounted into the server pod
# from the buildmax-worker-api-tls Secret; its SAN is the Service DNS name.
worker_api:
  listen: 0.0.0.0:5679
  tls:
    cert_file: /buildmax/tls/worker-api/tls.crt
    key_file: /buildmax/tls/worker-api/tls.key

# Space Secret encryption key, mounted from the buildmax-kek Secret that
# `./make kind up` generates (tools/mk/kind.go). Present only in kind, so the
# Secrets feature is on here and stays off in the committed baseline config.
secret:
  kek_file: /buildmax/kek/kek.json

storage:
  persist_backend: minio
  artifact_backend: minio
  minio:
    endpoint: http://minio.storage.svc.cluster.local:9000
    region: us-east-1
    bucket: bmstore
    prefix: workspaces
