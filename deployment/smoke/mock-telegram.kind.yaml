# A Telegram Bot API double for any number of bots, so kind runs the chat
# gateway and Space Assistant bots end to end. server.kind.yaml points
# channels.telegram.api_base_url at this Service and gives the system bot a
# token it accepts; an Assistant's bot is any other <digits>:<secret> token.
#
# Smoke-only. Nothing in deployment/production/ exposes a test double.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-smoke-telegram
  namespace: buildmax
spec:
  # One replica: queued updates and sent messages live in the process.
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-smoke-telegram
  template:
    metadata:
      labels:
        app: buildmax-smoke-telegram
    spec:
      containers:
        - name: mock-telegram
          image: buildmax-smoke-telegram:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-smoke-telegram
  namespace: buildmax
spec:
  selector:
    app: buildmax-smoke-telegram
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# A suite plays the people on the other side of the chat from outside the
# cluster: it sends a bot a message and reads what the bots answered. Only
# these routes are published; the Bot API itself stays on the in-cluster
# Service, where the server reaching it is evidence the deployment wired it up.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildmax-smoke-telegram-control
  namespace: buildmax
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /smoke-telegram/control/updates
            pathType: Exact
            backend:
              service:
                name: buildmax-smoke-telegram
                port:
                  number: 8080
          - path: /smoke-telegram/control/messages
            pathType: Exact
            backend:
              service:
                name: buildmax-smoke-telegram
                port:
                  number: 8080
          - path: /smoke-telegram/control/reset
            pathType: Exact
            backend:
              service:
                name: buildmax-smoke-telegram
                port:
                  number: 8080
