apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: storage
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-client
          # SILO's mc build; see the comment in minio.yaml.
          image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until mc alias set local http://minio.storage.svc.cluster.local:9000 minio minio123; do sleep 2; done;
              mc mb --ignore-existing local/bmstore;
              mc stat local/bmstore
