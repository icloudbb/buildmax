# Creates the bucket and the server's own storage identity. The server does not
# use MinIO's root account: a dedicated user holding only bmstore is what a real
# deployment gives it, and it is what makes the key rotatable — the root
# credential is MinIO's own configuration and cannot be overlapped with a
# successor (see docs/deploy/credential-rotation.md). `user add` also re-enables
# the user and resets its secret, so rerunning `./make kind up` after a rotation
# drill returns the cluster to these development keys.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: storage
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-client
          # SILO's mc build; see the comment in minio.yaml.
          image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -e;
              until mc alias set local http://minio.storage.svc.cluster.local:9000 minio minio123; do sleep 2; done;
              mc mb --ignore-existing local/bmstore;
              mc stat local/bmstore;
              printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::bmstore","arn:aws:s3:::bmstore/*"]}]}' > /tmp/bmstore-rw.json;
              mc admin policy create local bmstore-rw /tmp/bmstore-rw.json;
              mc admin user add local buildmax buildmax-storage;
              mc admin user enable local buildmax;
              mc admin policy attach local bmstore-rw --user buildmax || mc admin user info local buildmax | grep -q bmstore-rw
