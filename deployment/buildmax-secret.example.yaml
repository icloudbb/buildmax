# Template for the buildmax-secret used by deployment/buildmax-deploy.yaml.
#
# `./make setup local` copies this file to .local/buildmax-secret.yaml. Fill in
# real values there, then apply it yourself:
#
#   kubectl apply -f .local/buildmax-secret.yaml
#
# .local/ is gitignored. Never commit real credentials. `./make kind up` does
# not read that file: it generates a throwaway Secret of its own.
#
# Every key here overrides the matching field in the server.yaml carried by the
# buildmax-config ConfigMap. Non-secret configuration belongs in that ConfigMap,
# not here.
#
# Equivalent imperative form:
#
#   kubectl create secret generic buildmax-secret -n buildmax \
#     --from-literal=BUILDMAX_JWT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=BUILDMAX_DATABASE_PASSWORD=buildmax \
#     --from-literal=BUILDMAX_STORAGE_MINIO_ACCESS_KEY=minio \
#     --from-literal=BUILDMAX_STORAGE_MINIO_SECRET_KEY=minio123 \
#     --from-literal=BUILDMAX_CONVERSATION_MODEL_API_KEY=your-llm-api-key \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: buildmax-secret
  namespace: buildmax
type: Opaque
stringData:
  # Signing key for user JWTs. Generate with: openssl rand -base64 32
  BUILDMAX_JWT_SECRET: "replace-me-jwt-secret"
  # MySQL password for the user named in the ConfigMap's database block.
  # Matches the credentials created by ./make kind up.
  BUILDMAX_DATABASE_PASSWORD: "buildmax"
  # MinIO credentials. Match the values created by ./make kind up.
  BUILDMAX_STORAGE_MINIO_ACCESS_KEY: "minio"
  BUILDMAX_STORAGE_MINIO_SECRET_KEY: "minio123"
  # API key for the Tier 1 conversation model (OpenRouter by default).
  BUILDMAX_CONVERSATION_MODEL_API_KEY: "replace-me-llm-api-key"
  # Optional: the client secret your IdP issued, when server.yaml turns on
  # oidc. See docs/deploy/authentication.md.
  # BUILDMAX_OIDC_CLIENT_SECRET: "replace-me-oidc-client-secret"
