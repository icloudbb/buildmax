# BuildMax private deployment reference.
#
# This file is meant to be READ AND ADAPTED, not applied as-is. Every value
# written REPLACE_ME must be replaced; a `kubectl apply` of this file unchanged
# will fail to start, which is deliberate — a reference that half-works in the
# wrong environment is worse than one that refuses.
#
# It assumes you already operate the dependencies: a MySQL, an S3-compatible
# bucket, an ingress controller, and certificates. BuildMax brings the server,
# the Portal, and the worker Jobs the server creates. Nothing here installs a
# database or an object store; see deployment/buildmax-deploy.yaml for the
# self-contained local path, which is a development environment and not this.
#
# Read deployment/production/README.md first. It states the contract each
# dependency has to meet, which is the part a manifest cannot express.
---
apiVersion: v1
kind: Namespace
metadata:
  name: buildmax
---
# Non-secret configuration. Every credential comes from the Secret below, so
# this document is safe to keep in version control alongside your other
# manifests.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildmax-config
  namespace: buildmax
data:
  server.yaml: |
    port: 5678
    log_level: info

    # Where run state lives inside the pod before it is uploaded. This is an
    # emptyDir: a run's working files are scratch, and the durable copies go to
    # object storage.
    workspaces_dir: /buildmax/workspaces

    # Public origin of the Portal. Used to build links that leave the cluster.
    cors_origin: https://REPLACE_ME_PORTAL_HOST

    # Private deployments normally invite users rather than letting anyone in.
    allow_signup: false

    # The whole budget for an orderly stop: drain connections, let in-flight
    # runs report, stop the background loops. Keep it below
    # terminationGracePeriodSeconds minus the preStop sleep, or the kubelet
    # kills the process partway through.
    shutdown_grace: 25s

    database:
      host: REPLACE_ME_DB_HOST
      port: 3306
      user: REPLACE_ME_DB_USER
      name: buildmax
      # password comes from BUILDMAX_DATABASE_PASSWORD
      #
      # "true" requires TLS and verifies the certificate against the system
      # roots, which is what a managed database should get. Lower it to
      # "skip-verify" only for a server presenting a certificate your pods
      # cannot verify, and prefer fixing the trust store over doing that.
      tls: "true"

    storage:
      persist_backend: minio
      artifact_backend: minio
      minio:
        # Leave endpoint empty for AWS S3: the SDK resolves the regional
        # endpoint, and bucket addressing follows automatically. Set it to the
        # base URL of an S3-compatible store you run, which also switches
        # addressing to bucket-in-path.
        endpoint: ""
        region: REPLACE_ME_REGION
        bucket: REPLACE_ME_BUCKET
        prefix: workspaces
        # access_key and secret_key are deliberately absent. Without them the
        # AWS SDK's default credential chain applies, so the pod authenticates
        # through IRSA, workload identity, or an instance profile — no
        # long-lived key to store, ship to worker pods, or rotate.
        #
        # Set BUILDMAX_STORAGE_MINIO_ACCESS_KEY and _SECRET_KEY in the Secret
        # only for a store with no such mechanism.

    worker:
      run_mode: k8s_job
      # The internal worker Service below, over HTTPS. The worker control API
      # (/api/worker/*) is served only on that listener, off the public port,
      # so worker traffic never leaves through the Ingress and a NetworkPolicy
      # can admit only worker pods to it.
      server_url: https://buildmax-worker-api.buildmax.svc.cluster.local:5679
      # The CA the worker verifies the worker listener against, mounted into
      # every worker pod from the ConfigMap named in k8s.ca_config_map.
      server_ca_file: /buildmax/tls/worker-api-ca.crt
      k8s:
        namespace: buildmax
        image: REPLACE_ME_IMAGE
        config_map: buildmax-config
        # ConfigMap holding the worker-api CA (key: worker-api-ca.crt), mounted
        # read-only into each worker pod at worker.server_ca_file above. Create
        # it from the same CA that signed the buildmax-worker-api-tls Secret.
        ca_config_map: buildmax-worker-api-ca
        home_dir: /buildmax
        # Worker pods run root with every Linux capability dropped except
        # SYS_ADMIN, a Localhost seccomp profile, and an Unconfined AppArmor
        # profile -- see docs/reference/configuration.md's "How A Worker Pod
        # Is Confined" for why. None of that is configurable: a worker
        # executes model-chosen shell commands.
        #
        # A worker runs one task. Size these for the work you expect it to do,
        # not for the server; a build or a test suite needs considerably more
        # than an agent answering a question.
        resources:
          cpu_request: 500m
          cpu_limit: "2"
          memory_request: 1Gi
          memory_limit: 4Gi
          ephemeral_storage_request: 2Gi
          ephemeral_storage_limit: 20Gi

    # The internal worker listener. Bound to all interfaces here (not the
    # loopback default) so the buildmax-worker-api Service can reach it, and
    # fronted by that Service and a NetworkPolicy below. Its certificate must
    # carry the Service DNS name buildmax-worker-api.buildmax.svc.cluster.local.
    worker_api:
      listen: 0.0.0.0:5679
      tls:
        cert_file: /buildmax/tls/worker-api/tls.crt
        key_file: /buildmax/tls/worker-api/tls.key

    # Cross-replica coordination. Required because this manifest runs more than
    # one server replica: live streaming, connection events, and conversation
    # turn serialization are process-local without it, so two replicas would
    # split a stream and race a conversation's turns. See
    # docs/design/server-coordination.md. A single-replica deployment may set
    # mode: local and drop the buildmax-redis Deployment below.
    coordination:
      mode: redis
      redis:
        address: buildmax-redis:6379
        # password comes from BUILDMAX_COORDINATION_REDIS_PASSWORD when the Redis
        # requires auth; the in-cluster Redis below runs without it.

    # The deployment key-encryption key (KEK). It seals managed-model provider
    # credentials and Space Secrets in the database; without it, adding a model
    # with an API key is refused and Space Secrets are off. Only the path lives
    # here: the key itself is mounted from the buildmax-kek Secret, never put in
    # this ConfigMap or the environment. See README.md, "Key-encryption key".
    secret:
      kek_file: /etc/buildmax/kek/kek.json

    conversation:
      model:
        name: default
        api_url: https://REPLACE_ME_MODEL_ENDPOINT/v1
        model: REPLACE_ME_MODEL
        # api_key comes from BUILDMAX_CONVERSATION_MODEL_API_KEY
---
# Credentials.
#
# This is a shape, not something to commit filled in. Most deployments generate
# it from their own secret manager — External Secrets, Vault, sealed-secrets —
# and the only contract BuildMax has is the Secret's name and its keys.
#
# Omit BUILDMAX_STORAGE_MINIO_* entirely when using IRSA or workload identity.
apiVersion: v1
kind: Secret
metadata:
  name: buildmax-secret
  namespace: buildmax
type: Opaque
stringData:
  # Signs user access tokens and worker run tokens. Generate with:
  # openssl rand -base64 32
  # Rotating it invalidates every access and run token immediately. Refresh
  # tokens survive, so signed-in clients recover without a new login; runs in
  # flight are lost unless the workers are drained first. It does not sign
  # anyone out — revoke sessions for that. See docs/deploy/authentication.md.
  BUILDMAX_JWT_SECRET: REPLACE_ME
  BUILDMAX_DATABASE_PASSWORD: REPLACE_ME
  BUILDMAX_CONVERSATION_MODEL_API_KEY: REPLACE_ME
  # BUILDMAX_STORAGE_MINIO_ACCESS_KEY: REPLACE_ME
  # BUILDMAX_STORAGE_MINIO_SECRET_KEY: REPLACE_ME
  # Set only when coordination.redis requires auth; the in-cluster Redis does not.
  # BUILDMAX_COORDINATION_REDIS_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildmax-server
  namespace: buildmax
  # On EKS, this is what grants the bucket without a stored key. The equivalent
  # on GKE is iam.gke.io/gcp-service-account; on AKS, an azure.workload.identity
  # label plus client-id annotation.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ME:role/REPLACE_ME
---
# The server creates worker Jobs, so it needs to manage them in its own
# namespace. It needs nothing cluster-wide, and nothing outside this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildmax-server
  namespace: buildmax
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildmax-server
  namespace: buildmax
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildmax-server
subjects:
  - kind: ServiceAccount
    name: buildmax-server
    namespace: buildmax
---
# Puts the worker's custom seccomp profile on every node's kubelet seccomp
# directory, from the buildmax-worker-seccomp ConfigMap -- create it before
# applying this file:
#   kubectl create configmap buildmax-worker-seccomp -n buildmax \
#     --from-file=worker-bwrap.json=deployment/seccomp/worker-bwrap.json
# See deployment/seccomp/README.md for what the profile does and why
# RuntimeDefault is not enough for a worker pod, and re-run the command above
# whenever that file changes.
#
# Runs as root and writes to a host path outside any pod's own namespace by
# necessity -- Kubernetes' Localhost seccomp type takes a node-local file
# path, not a value inlined in the pod spec, and there is no in-cluster way
# to put a file there except a privileged installer. Its blast radius is one
# static file this repository owns, not model-chosen commands.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: buildmax-worker-seccomp
  namespace: buildmax
spec:
  selector:
    matchLabels:
      app: buildmax-worker-seccomp
  template:
    metadata:
      labels:
        app: buildmax-worker-seccomp
    spec:
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: install
          image: REPLACE_ME_IMAGE
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /host-seccomp/buildmax
              cp /profile/worker-bwrap.json /host-seccomp/buildmax/worker-bwrap.json
              echo "installed worker-bwrap.json; watching for updates"
              while true; do sleep 3600; done
          volumeMounts:
            - name: profile
              mountPath: /profile
            - name: host-seccomp
              mountPath: /host-seccomp
      volumes:
        - name: profile
          configMap:
            name: buildmax-worker-seccomp
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
---
# Redis backs cross-replica coordination (coordination.mode: redis). It carries
# live state only — streamed deltas, connection-event fan-out, and conversation
# turn leases — never durable data, so it needs no persistence volume: a restart
# costs at most in-flight stream deltas and a brief re-acquire of conversation
# leases. One replica is the first supported topology; an operator who needs
# Redis HA points coordination.redis.address at their own Sentinel or Cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-redis
  namespace: buildmax
  labels:
    app: buildmax-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-redis
  template:
    metadata:
      labels:
        app: buildmax-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-redis
  namespace: buildmax
spec:
  selector:
    app: buildmax-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-server
  namespace: buildmax
  labels:
    app: buildmax-server
spec:
  # Two or more so a node drain or a rollout does not take the API down.
  # Durable state lives in MySQL and object storage, so replicas need no volume
  # affinity, and the scheduler claims runs by an atomic status transition, so
  # more replicas mean more pollers, not duplicated work.
  #
  # Live state — streamed deltas, connection events, and conversation turn
  # serialization — is NOT process-local here only because coordination.mode is
  # redis in the ConfigMap above, backed by the buildmax-redis Deployment. Set
  # this to 1 if you set coordination.mode: local. See
  # docs/design/server-coordination.md.
  replicas: 2
  selector:
    matchLabels:
      app: buildmax-server
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: buildmax-server
    spec:
      serviceAccountName: buildmax-server
      # Must exceed shutdown_grace in the ConfigMap plus the preStop sleep
      # below, or the kubelet kills the process partway through an orderly
      # stop. See docs/design/graceful-shutdown.md.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Pin a version. :latest makes a rollback a guess about what was
          # running, and this deployment's rollback story is "run the previous
          # image", which needs the previous image to be nameable.
          image: REPLACE_ME_IMAGE
          command: ["/usr/local/bin/buildmax-server"]
          ports:
            - containerPort: 5678
              name: http
            # The internal worker control API. Reached only through the
            # buildmax-worker-api Service, never the Ingress.
            - containerPort: 5679
              name: worker-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Readiness reflects MySQL and object storage: a dependency outage
          # takes the pod out of the Service instead of letting it accept
          # requests it cannot serve.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Liveness checks nothing but the process. A liveness probe that
          # failed on a dependency outage would restart a healthy server and
          # turn a recoverable outage into a crash loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          # The kubelet sends SIGTERM and removes the endpoint at the same
          # time, so without this pause a request admitted during propagation
          # meets a closed listener. Five seconds of a draining server — which
          # answers /readyz with 503 and finishes what it accepted — turns that
          # into an ordinary retry.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Schema migrations run at startup, so give the first pod of an
          # upgrade room to finish before liveness starts counting.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          env:
            - name: BUILDMAX_HOME
              value: "/buildmax"
            - name: BUILDMAX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_JWT_SECRET
            - name: BUILDMAX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_DATABASE_PASSWORD
            - name: BUILDMAX_CONVERSATION_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_CONVERSATION_MODEL_API_KEY
            # Only when not using IRSA or workload identity.
            # - name: BUILDMAX_STORAGE_MINIO_ACCESS_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: buildmax-secret
            #       key: BUILDMAX_STORAGE_MINIO_ACCESS_KEY
            # - name: BUILDMAX_STORAGE_MINIO_SECRET_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: buildmax-secret
            #       key: BUILDMAX_STORAGE_MINIO_SECRET_KEY
          volumeMounts:
            - name: buildmax-home
              mountPath: /buildmax
            # subPath mounts the single file, leaving the rest of BUILDMAX_HOME
            # writable for sessions, logs, and traces.
            - name: buildmax-config
              mountPath: /buildmax/server.yaml
              subPath: server.yaml
              readOnly: true
            # The worker listener's server certificate and key. Mounted only
            # into server pods; a worker pod never sees the private key.
            - name: worker-api-tls
              mountPath: /buildmax/tls/worker-api
              readOnly: true
            # The KEK file secret.kek_file names. Server pods only; a worker
            # pod never mounts it. Outside BUILDMAX_HOME on purpose, per
            # docs/design/space-secrets.md §9.1.
            - name: buildmax-kek
              mountPath: /etc/buildmax/kek
              readOnly: true
            # The root filesystem is read-only; this is the writable path
            # ordinary tooling assumes.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
      volumes:
        - name: buildmax-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: buildmax-config
          configMap:
            name: buildmax-config
        # A TLS Secret (keys tls.crt, tls.key) holding the worker listener's
        # certificate for buildmax-worker-api.buildmax.svc.cluster.local. Supply
        # it from cert-manager or your own CA; the server refuses to start if it
        # cannot load the keypair.
        - name: worker-api-tls
          secret:
            secretName: buildmax-worker-api-tls
        # The KEK, under the key kek.json. Deliberately not a document in this
        # file: re-applying a placeholder over the real key would lose every
        # sealed credential. Generate it once, back it up apart from the
        # database, and create the Secret before applying this file:
        #   printf '{"current":"file:root:1","keys":{"file:root:1":"%s"}}\n' \
        #     "$(openssl rand -base64 32)" > kek.json
        #   kubectl create secret generic buildmax-kek -n buildmax \
        #     --from-file=kek.json=kek.json
        # Not optional: a server configured with secret.kek_file must not start
        # without its key. Owner-only 0400; with the pod's fsGroup the kubelet
        # adds group read, so the file is 0440 root:65532 — readable by the
        # server and no one else. Keep fsGroup if you change this pod's
        # securityContext, or the server cannot read it.
        - name: buildmax-kek
          secret:
            secretName: buildmax-kek
            defaultMode: 0400
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: buildmax-server
  namespace: buildmax
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: buildmax-server
---
# The public API Service. The Ingress points here; it carries no worker route.
apiVersion: v1
kind: Service
metadata:
  name: buildmax-api
  namespace: buildmax
spec:
  selector:
    app: buildmax-server
  ports:
    - name: http
      port: 5678
      targetPort: 5678
---
# The internal worker control API. A ClusterIP with no Ingress in front of it;
# the NetworkPolicy below is what limits who may connect, since a ClusterIP
# alone is discoverability, not authorization.
apiVersion: v1
kind: Service
metadata:
  name: buildmax-worker-api
  namespace: buildmax
spec:
  type: ClusterIP
  selector:
    app: buildmax-server
  ports:
    - name: worker-api
      port: 5679
      targetPort: 5679
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-portal
  namespace: buildmax
  labels:
    app: buildmax-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: buildmax-portal
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: buildmax-portal
    spec:
      containers:
        - name: portal
          image: REPLACE_ME_PORTAL_IMAGE
          ports:
            - containerPort: 80
              name: http
          env:
            # The Portal image ships one bundle for every deployment and reads
            # this at container start. "/" means same-origin, which is what the
            # Ingress below produces.
            - name: BUILDMAX_API_BASE
              value: "/"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-portal
  namespace: buildmax
spec:
  selector:
    app: buildmax-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# One origin serves the Portal and the API, which is what BUILDMAX_API_BASE="/"
# above depends on. Splitting them across two hosts means setting an absolute
# API base and configuring CORS instead.
#
# No ingress class is assumed. Set ingressClassName to whatever your cluster
# runs; annotations differ by controller, so any you need go here too.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildmax
  namespace: buildmax
spec:
  ingressClassName: REPLACE_ME_INGRESS_CLASS
  tls:
    - hosts:
        - REPLACE_ME_PORTAL_HOST
      # A Secret holding the certificate. cert-manager fills this in from an
      # annotation; ACM and other cloud terminators do not use it at all.
      secretName: buildmax-tls
  rules:
    - host: REPLACE_ME_PORTAL_HOST
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: buildmax-api
                port:
                  number: 5678
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: buildmax-api
                port:
                  number: 5678
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: buildmax-api
                port:
                  number: 5678
          - path: /
            pathType: Prefix
            backend:
              service:
                name: buildmax-portal
                port:
                  number: 80
---
# The boundary the two Services make enforceable. Without it a ClusterIP is only
# a name: any pod could still dial the worker port by Service or pod IP. This
# selects the server pods and states who may reach each port.
#
# The public port is left open to the cluster here because public API auth is at
# the application layer and Ingress exposure is intentional; narrow it to your
# ingress-controller namespace, where your CNI and health-probe behaviour are
# known. The worker port is restricted to pods carrying the worker labels the
# Kubernetes runner stamps on every worker Job. See
# docs/design/worker-api-network-boundary.md §7.3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildmax-server
  namespace: buildmax
spec:
  podSelector:
    matchLabels:
      app: buildmax-server
  policyTypes:
    - Ingress
  ingress:
    # Public API and Portal traffic.
    - ports:
        - protocol: TCP
          port: 5678
    # Worker control API: only from worker pods in this namespace.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: buildmax-worker
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 5679
