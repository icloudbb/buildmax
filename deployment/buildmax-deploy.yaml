# BuildMax server deployment for a Kubernetes cluster. `./make kind up` applies
# a local smoke overlay; operators can use this file as the readable baseline.
#
# This file contains NO credentials. The buildmax-secret it references must be
# created separately:
#
#   ./make setup local     # writes .local/buildmax-secret.yaml from the example
#   # fill in real values, then:
#   kubectl apply -f .local/buildmax-secret.yaml
#
# .local/ is gitignored. ./make kind up does not read this file: that path
# generates a throwaway Secret of its own, so apply this one yourself.
#
# The local kind path exposes Portal and API on http://localhost:8080.
---
apiVersion: v1
kind: Namespace
metadata:
  name: buildmax
---
# Non-secret server configuration. Mounted as <BUILDMAX_HOME>/server.yaml into the
# server pod and into every worker Job pod, so both read the same file.
# Credentials are NOT here — they come from buildmax-secret via the environment
# overrides below, which take precedence over the fields in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildmax-config
  namespace: buildmax
data:
  server.yaml: |
    log_level: info
    port: 5678
    cors_origin: http://localhost:8080
    # Single-origin ingress, so artifact share links are built from the same
    # host the Portal and API are served on.
    public_base_url: http://localhost:8080
    # Below terminationGracePeriodSeconds minus the preStop sleep.
    shutdown_grace: 25s
    workspaces_dir: /buildmax/workspaces
    default_quota_tier: free_trial

    # This manifest runs two server replicas, so live streaming, connection
    # events, and conversation turn serialization must be shared rather than
    # process-local. See docs/design/server-coordination.md.
    coordination:
      mode: redis
      redis:
        address: buildmax-redis.buildmax.svc.cluster.local:6379

    conversation:
      model:
        model: openai/gpt-4o-mini
        api_url: https://openrouter.ai/api/v1
        context_window: 128000
        # api_key comes from BUILDMAX_CONVERSATION_MODEL_API_KEY

        # To run Tier 1 on a local Ollama daemon instead, replace the four lines
        # above with these. No credential is involved, so the secret's
        # BUILDMAX_CONVERSATION_MODEL_API_KEY goes unused.
        #
        # api_url must be reachable from this pod, and localhost is the pod:
        #   Docker Desktop     http://host.docker.internal:11434
        #   Linux + kind/k3d   http://172.x.0.1:11434 (docker network inspect kind)
        #                      plus OLLAMA_HOST=0.0.0.0 on the host daemon
        #
        # model: qwen3:8b
        # provider: ollama
        # api_url: http://host.docker.internal:11434
        # context_window: 32000

    database:
      host: mysql.db.svc.cluster.local
      port: 3306
      user: buildmax
      name: buildmax
      # password comes from BUILDMAX_DATABASE_PASSWORD

    webhook:
      message_path: message
      user_id: webhook

    worker:
      binary: buildmax-worker
      run_mode: k8s_job
      # The internal worker Service below, over HTTPS. `./make kind up`
      # generates the certificate and CA (tools/mk/kind_tls.go); the worker
      # verifies the server against the CA mounted from k8s.ca_config_map.
      server_url: https://buildmax-worker-api.buildmax.svc.cluster.local:5679
      server_ca_file: /buildmax/tls/worker-api-ca.crt
      k8s:
        namespace: buildmax
        image: buildmax:local
        config_map: buildmax-config
        ca_config_map: buildmax-worker-api-ca
        home_dir: /buildmax
        # Worker pods run root with every Linux capability dropped except
        # SYS_ADMIN, a Localhost seccomp profile, and an Unconfined AppArmor
        # profile -- see docs/reference/configuration.md's "How A Worker Pod
        # Is Confined" for why, and deployment/seccomp/README.md for how it
        # was found. None of that is configurable, because a worker runs
        # model-chosen shell commands.
        #
        # Every bound is required in this run mode: the server refuses to
        # start rather than schedule an unbounded worker. These values are a
        # starting point, not a measurement — raise them if runs are killed.
        resources:
          cpu_request: 250m
          cpu_limit: "2"
          memory_request: 512Mi
          memory_limit: 2Gi
          ephemeral_storage_request: 1Gi
          ephemeral_storage_limit: 10Gi

    # The internal worker listener, bound to all interfaces so the
    # buildmax-worker-api Service reaches it, over TLS. The certificate is
    # mounted into the server pod from the buildmax-worker-api-tls Secret.
    worker_api:
      listen: 0.0.0.0:5679
      tls:
        cert_file: /buildmax/tls/worker-api/tls.crt
        key_file: /buildmax/tls/worker-api/tls.key

    storage:
      persist_backend: minio
      artifact_backend: minio
      minio:
        endpoint: http://minio.storage.svc.cluster.local:9000
        region: us-east-1
        bucket: bmstore
        prefix: workspaces
        # access_key / secret_key come from BUILDMAX_STORAGE_MINIO_*
---
# ServiceAccount for server; used when worker.run_mode is k8s_job to create worker Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildmax-server
  namespace: buildmax
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildmax-server
  namespace: buildmax
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildmax-server
  namespace: buildmax
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildmax-server
subjects:
  - kind: ServiceAccount
    name: buildmax-server
    namespace: buildmax
---
# Puts the worker's custom seccomp profile on every node's kubelet seccomp
# directory, from the buildmax-worker-seccomp ConfigMap (created by
# ./make kind up from deployment/seccomp/worker-bwrap.json, not embedded
# here -- see deployment/seccomp/README.md for what it does and why
# RuntimeDefault is not enough for a worker pod). A worker Job's
# securityContext.seccompProfile.localhostProfile names this path; the pod
# fails to start on any node this DaemonSet has not yet reached.
#
# Runs as root and writes to a host path outside any pod's own namespace by
# necessity -- Kubernetes' Localhost seccomp type takes a node-local file
# path, not a value inlined in the pod spec, and there is no in-cluster way
# to put a file there except a privileged installer. Its blast radius is one
# static file this repository owns, not model-chosen commands.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: buildmax-worker-seccomp
  namespace: buildmax
spec:
  selector:
    matchLabels:
      app: buildmax-worker-seccomp
  template:
    metadata:
      labels:
        app: buildmax-worker-seccomp
    spec:
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: install
          image: buildmax:local
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /host-seccomp/buildmax
              cp /profile/worker-bwrap.json /host-seccomp/buildmax/worker-bwrap.json
              echo "installed worker-bwrap.json; watching for updates"
              while true; do sleep 3600; done
          volumeMounts:
            - name: profile
              mountPath: /profile
            - name: host-seccomp
              mountPath: /host-seccomp
      volumes:
        - name: profile
          configMap:
            name: buildmax-worker-seccomp
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
---
# Redis backs cross-replica coordination (coordination.mode: redis). It carries
# live state only — no persistence volume — so a restart costs at most in-flight
# stream deltas and a brief re-acquire of conversation leases.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-redis
  namespace: buildmax
  labels:
    app: buildmax-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-redis
  template:
    metadata:
      labels:
        app: buildmax-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-redis
  namespace: buildmax
spec:
  selector:
    app: buildmax-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-server
  namespace: buildmax
  labels:
    app: buildmax-server
spec:
  # Two replicas exercise the coordination backend: live state is shared through
  # buildmax-redis, not held per process. See docs/design/server-coordination.md.
  replicas: 2
  selector:
    matchLabels:
      app: buildmax-server
  template:
    metadata:
      labels:
        app: buildmax-server
    spec:
      serviceAccountName: buildmax-server
      # Must exceed shutdown_grace plus the preStop sleep, the same as the
      # production reference. See docs/design/graceful-shutdown.md.
      terminationGracePeriodSeconds: 45
      # The same containment the production reference applies. It lives here
      # too so `./make kind up` exercises it on every run — a hardening setting
      # that only appears in a manifest nobody applies is a guess.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: buildmax:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/buildmax-server"]
          ports:
            - containerPort: 5678
              name: http
            # The internal worker control API, reached only through the
            # buildmax-worker-api Service.
            - containerPort: 5679
              name: worker-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Readiness reflects MySQL and object storage, so a dependency outage
          # takes this pod out of the Service instead of letting it accept
          # requests it cannot serve.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            # Failing readiness only stops traffic, so tolerate a brief blip
            # rather than flapping the endpoint on one slow query.
            failureThreshold: 3
          # Liveness stays on /healthz, which checks nothing. A liveness probe
          # that failed on a dependency outage would restart a healthy server
          # and turn a recoverable outage into a crash loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          # Covers endpoint propagation: SIGTERM and endpoint removal happen
          # concurrently, so a request admitted in that window would otherwise
          # meet a closed listener.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          env:
            # Locates server.yaml and holds sessions, logs, and traces.
            - name: BUILDMAX_HOME
              value: "/buildmax"
            # Credentials only. Each overrides the matching server.yaml field.
            - name: BUILDMAX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_JWT_SECRET
            - name: BUILDMAX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_DATABASE_PASSWORD
            - name: BUILDMAX_STORAGE_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_STORAGE_MINIO_ACCESS_KEY
            - name: BUILDMAX_STORAGE_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_STORAGE_MINIO_SECRET_KEY
            - name: BUILDMAX_CONVERSATION_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildmax-secret
                  key: BUILDMAX_CONVERSATION_MODEL_API_KEY
          volumeMounts:
            - name: buildmax-home
              mountPath: /buildmax
            # subPath mounts the single file, leaving the rest of BUILDMAX_HOME writable.
            - name: buildmax-config
              mountPath: /buildmax/server.yaml
              subPath: server.yaml
              readOnly: true
            # The worker listener's certificate and key, generated by
            # `./make kind up`. Mounted only into the server pod; a worker pod
            # gets the CA (below), never the private key.
            - name: worker-api-tls
              mountPath: /buildmax/tls/worker-api
              readOnly: true
            # Deployment key-encryption key. It protects Space Secrets and
            # managed-model provider credentials at rest. Optional so a deployment
            # that uses neither starts without the Secret present; the feature
            # turns on only when secret.kek_file also points here (kind does; the
            # baseline config above does not). Without it, adding a model that
            # carries a credential is refused. Outside BUILDMAX_HOME, as
            # docs/design/space-secrets.md §9.1 requires.
            - name: buildmax-kek
              mountPath: /etc/buildmax/kek
              readOnly: true
            # The root filesystem is read-only; this is the writable path
            # ordinary tooling assumes.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: buildmax-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: buildmax-config
          configMap:
            name: buildmax-config
        # Created by tools/mk/kind_tls.go before this deployment is applied.
        - name: worker-api-tls
          secret:
            secretName: buildmax-worker-api-tls
        # Space Secret KEK. optional: a real deployment that does not use Space
        # Secrets never creates this Secret and the pod still starts; kind's
        # `applyKindKEK` creates it and turns the feature on via secret.kek_file.
        # Owner-only 0400; with the pod's fsGroup the kubelet adds group read,
        # so the file is 0440 root:65532 — readable by the server, no one else.
        - name: buildmax-kek
          secret:
            secretName: buildmax-kek
            optional: true
            defaultMode: 0400
---
# The public API Service. The Ingress points here; it carries no worker route.
apiVersion: v1
kind: Service
metadata:
  name: buildmax-api
  namespace: buildmax
spec:
  selector:
    app: buildmax-server
  ports:
    - name: http
      port: 5678
      targetPort: 5678
---
# The internal worker control API. Its NetworkPolicy is below; a ClusterIP alone
# is discoverability, not authorization.
apiVersion: v1
kind: Service
metadata:
  name: buildmax-worker-api
  namespace: buildmax
spec:
  type: ClusterIP
  selector:
    app: buildmax-server
  ports:
    - name: worker-api
      port: 5679
      targetPort: 5679
---
# Only worker pods may reach the worker port; the public port stays open to the
# cluster (Ingress exposure is intentional and public auth is at the app layer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildmax-server
  namespace: buildmax
spec:
  podSelector:
    matchLabels:
      app: buildmax-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5678
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: buildmax-worker
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 5679
---
# Portal (React app served by nginx).
#
# Image: buildmax-portal:local, built by ./make kind reload. This manifest
# targets the local kind cluster; a real deployment pulls the published image,
# ghcr.io/icloudbb/buildmax-portal:<version>, and sets the same
# BUILDMAX_API_BASE. See docs/deploy/overview.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildmax-portal
  namespace: buildmax
  labels:
    app: buildmax-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildmax-portal
  template:
    metadata:
      labels:
        app: buildmax-portal
    spec:
      containers:
        - name: portal
          image: buildmax-portal:local
          imagePullPolicy: IfNotPresent
          env:
            # Portal and API share one Ingress origin. Runtime config.js keeps
            # the image portable while avoiding local host aliases and CORS.
            - name: BUILDMAX_API_BASE
              value: /
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: buildmax-portal
  namespace: buildmax
spec:
  selector:
    app: buildmax-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildmax-portal
  namespace: buildmax
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: buildmax-api
                port:
                  number: 5678
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: buildmax-api
                port:
                  number: 5678
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: buildmax-api
                port:
                  number: 5678
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: buildmax-api
                port:
                  number: 5678
          - path: /
            pathType: Prefix
            backend:
              service:
                name: buildmax-portal
                port:
                  number: 80
---
# The public artifact-share surface is single-origin here: the bare
# /shared/artifacts/{token} page is the Portal SPA (caught by "/" above), but
# its two machine leaves — the metadata and the bytes — are the API's. A regex
# ingress routes only those two to the server; the page still falls through to
# the SPA. See docs/design/artifact-public-sharing-and-preview.md §6.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildmax-shared-content
  namespace: buildmax
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /shared/artifacts/[^/]+/(raw|meta)$
            pathType: ImplementationSpecific
            backend:
              service:
                name: buildmax-api
                port:
                  number: 5678
