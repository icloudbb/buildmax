# BuildMax on one machine: MySQL, the server (which spawns workers itself), and
# the Portal. Enough to evaluate the space surface, and small enough to read.
#
#   cd deployment/compose
#   ./generate-env.sh          # writes .env with two generated secrets
#   docker compose up -d
#   docker compose exec server buildmax-server user create you@example.com
#   docker compose exec server buildmax-server user login-code you@example.com
#
# Then open http://localhost:8080 and sign in with that code.
# Full walkthrough: docs/deploy/compose.md.
#
# What this is not: there is no MinIO here, because the server and the workers
# it spawns share one container and one volume, so the local filesystem backend
# is enough. A deployment where workers run elsewhere needs blob storage both
# can reach — see docs/deploy/overview.md. That shared container is one trust
# domain: a task run is a child of the server under the same uid, not something
# separated from it. Kubernetes Jobs are where that boundary exists.

name: buildmax

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: buildmax
      MYSQL_USER: buildmax
      MYSQL_PASSWORD: ${BUILDMAX_DATABASE_PASSWORD:?run ./generate-env.sh first}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # The server exits if it cannot open the database, so it waits for this.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubuildmax", "-p${BUILDMAX_DATABASE_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  server:
    # `image` names what to build and what to pull. Until a release publishes
    # these tags, `docker compose up` builds them from this checkout; after one
    # does, `docker compose pull` gets them instead.
    image: ghcr.io/icloudbb/buildmax:${BUILDMAX_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.buildmax
    entrypoint: ["/usr/local/bin/buildmax-server"]
    restart: unless-stopped
    # The worker this server spawns (worker.run_mode: local_process in
    # server.yaml) wraps its Bash commands in bwrap the same as a k8s_job
    # worker does -- see internal/config/sandbox.go's WorkerSandboxSurface.
    # This server runs as root (no USER in Dockerfile.buildmax), and building
    # bwrap's sandbox as root needs all three of the below, isolated one at a
    # time against a real Deployment smoke run and the exact seccomp profile
    # below -- each removes exactly one Operation-not-permitted failure and
    # the next one is only visible once the one before it is gone:
    #   - cap_add SYS_ADMIN: without it, unshare(CLONE_NEWUSER) itself fails
    #     ("Creating new namespace failed"). Root has no capabilities gated
    #     behind CAP_SYS_ADMIN in Docker's default set (it is not root in the
    #     sense of "has every capability"), the same reason the k8s Job pod's
    #     seccomp profile below exists.
    #   - security_opt seccomp: with SYS_ADMIN but Docker's default seccomp
    #     profile, bwrap gets past namespace creation and pivot_root but then
    #     fails the mount(MS_SLAVE) call bwrap makes on `/` afterward ("Failed
    #     to make / slave"). Same profile as the k8s Job's Localhost seccomp
    #     profile; see deployment/seccomp/README.md.
    #   - security_opt apparmor: unconfined: with both of the above, Docker's
    #     default AppArmor profile (docker-default) still denies that same
    #     mount(MS_SLAVE) call independently of seccomp -- AppArmor mediates
    #     `mount,` operations on its own policy, which the seccomp profile
    #     cannot reach. A k8s/containerd pod is not confined by an AppArmor
    #     profile the way `docker run` is by default, which is a difference
    #     worth keeping in mind if bwrap ever needs debugging there too.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:../seccomp/worker-bwrap.json
      - apparmor:unconfined
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      BUILDMAX_HOME: /buildmax
      # Secrets stay out of server.yaml and arrive from .env, the same override
      # path a Kubernetes Secret uses.
      BUILDMAX_JWT_SECRET: ${BUILDMAX_JWT_SECRET:?run ./generate-env.sh first}
      BUILDMAX_DATABASE_PASSWORD: ${BUILDMAX_DATABASE_PASSWORD}
      # Optional: without it the Portal loads but conversations cannot run.
      BUILDMAX_CONVERSATION_MODEL_API_KEY: ${BUILDMAX_CONVERSATION_MODEL_API_KEY:-}
    volumes:
      - ./server.yaml:/buildmax/server.yaml:ro
      - server-data:/data
    ports:
      - "${BUILDMAX_SERVER_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  portal:
    image: ghcr.io/icloudbb/buildmax-portal:${BUILDMAX_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.portal
    restart: unless-stopped
    environment:
      # Same-origin: the gateway serves the Portal and proxies the API under one
      # host, so the browser calls the API at "/" on the Portal's own origin.
      # This is what lets the server's same-origin session-cookie check pass; a
      # split-origin setup would be blocked as cross-site. The gateway, not the
      # Portal, owns the published port.
      BUILDMAX_API_BASE: /

  # One origin for the browser: it serves the Portal and proxies the API, so the
  # session cookie and its same-origin check work. The kind reference does this
  # with an ingress; this is its Compose equivalent. See gateway.conf.
  gateway:
    image: nginx:alpine-slim
    restart: unless-stopped
    depends_on:
      - server
      - portal
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BUILDMAX_PORTAL_PORT:-8080}:80"

volumes:
  mysql-data:
  server-data:
