# Single-origin gateway for the Compose bundle.
#
# The Portal's session credential is a SameSite=Strict cookie, and the server
# refuses a cross-origin request to its session routes (requirePortalOrigin) as
# CSRF defence. So the browser must reach the Portal and the API on one origin.
# This gateway is that origin: it serves the SPA and the API from the one host
# the browser talks to, exactly as the kind ingress does. It mirrors that
# ingress's routing.
#
# Host is forwarded verbatim (with its port) so the server's same-origin check
# sees the origin the browser actually used, not this container's name.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The API and the other server-served paths, matching the kind ingress.
    # Buffering off and long timeouts so the /api/spaces/{id}/ws WebSocket streams
    # a turn's tokens through instead of nginx holding them or closing the
    # long-lived connection at the 60s default.
    location /api/ {
        proxy_pass http://server:5678;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /healthz      { proxy_pass http://server:5678; }
    location = /openapi.json { proxy_pass http://server:5678; }
    location /swagger        { proxy_pass http://server:5678; }
    location /shared/        { proxy_pass http://server:5678; }

    # Everything else is the Portal SPA.
    location / { proxy_pass http://portal:80; }
}
