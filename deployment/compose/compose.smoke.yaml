services:
  mock-llm:
    image: buildmax-smoke-llm:local
    build:
      context: ../..
      dockerfile: deployment/smoke/mock-llm/Dockerfile
    # Published so the smoke can arm a stall and keep a run mid-turn long
    # enough to cancel it. The server reaches the model over the Compose
    # network, not through this port.
    ports:
      - "${BUILDMAX_SMOKE_LLM_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "/mock-llm", "healthcheck"]
      interval: 2s
      timeout: 1s
      retries: 10

  server:
    depends_on:
      mock-llm:
        condition: service_healthy
    environment:
      BUILDMAX_CONVERSATION_MODEL_API_KEY: smoke-key
    volumes:
      - ../smoke/server.compose.yaml:/buildmax/server.yaml:ro
    # Space Secrets need a KEK, which the browser suite needs to reach the
    # Secret paths (a run refused for a disabled grant). A throwaway one is
    # generated on the data volume the first time the stack starts, so it
    # lives exactly as long as the Secrets it seals and `down -v` removes both.
    # Like kind's, it exists only in this smoke stack; the baseline stays off.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/smoke-kek.json ]; then
          key=$$(head -c 32 /dev/urandom | base64)
          printf '{"current":"smoke","keys":{"smoke":"%s"}}' "$$key" > /data/smoke-kek.json
        fi
        exec /usr/local/bin/buildmax-server
