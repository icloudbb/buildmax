version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/gui"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # One entry so a group spans both packages: the visual suite renders both
  # in one Playwright image and refuses lockfiles that pin different versions.
  - package-ecosystem: npm
    directories: ["/portal", "/desktop/frontend"]
    schedule:
      interval: weekly
    groups:
      playwright:
        applies-to: version-updates
        patterns: ["@playwright/test"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
