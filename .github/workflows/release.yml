name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release and upload archives
  packages: write   # push the container image to ghcr.io
  id-token: write   # sign GitHub artifact attestations through OIDC
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the version from tags, so it needs the full history.
          fetch-depth: 0

      - name: Require a version tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Release must run against an existing v* tag, not $GITHUB_REF." >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.51.0

      # Required to build the linux/arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser can only hold a static header and footer, so the release body
      # is composed here from the tag's CHANGELOG.md section. A tag with no
      # section fails the release rather than publishing notes without it.
      - name: Compose release notes
        run: go run ./tools/mk release notes "${GITHUB_REF_NAME}" -o .artifacts/release-notes.md

      # The image is scanned before anything is published, so a vulnerable
      # base can only fail the release instead of shipping in it. dockers_v2
      # builds and pushes in one buildx call and skips the build entirely under
      # --skip=publish, so the only image that can exist beforehand is a
      # snapshot one: same Dockerfile, same base, same binaries, a version
      # string that differs. v0.2.0-alpha.3 published both images and then
      # failed the scan that used to sit after this step.
      - name: Build the images to scan
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: release --clean --snapshot --skip=archive,sbom,announce

      # GoReleaser names a snapshot image after the commit, so the tags are read
      # back rather than reconstructed here.
      - name: Resolve the scan targets
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            image=$(jq -er --arg suffix "-$arch" '
              [.[] | select(.type == "Docker Image") | .name | select(endswith($suffix))]
              | if length == 1 then .[0] else
                  error("expected one \($suffix) image, got \(length)")
                end' dist/artifacts.json)
            echo "image_$arch=$image" >> "$GITHUB_OUTPUT"
          done

      # The scanner's cache lives outside the checkout on purpose: its default
      # is `$GITHUB_WORKSPACE/.cache`, and an untracked directory there makes
      # GoReleaser refuse the release below as a dirty git state. v0.2.0-alpha.5
      # was tagged and never published for exactly that.
      - name: Scan the linux/amd64 image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan.outputs.image_amd64 }}
          cache-dir: ${{ runner.temp }}/trivy
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan the linux/arm64 image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan.outputs.image_arm64 }}
          cache-dir: ${{ runner.temp }}/trivy
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # --clean drops the snapshot's dist/. The Go build cache carries over, so
      # this run recompiles very little of what the scan build just built.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: release --clean --release-notes=.artifacts/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Artifact attestations are public infrastructure. Skip them while the
      # repository is private; they become mandatory when it is made public.
      - name: Attest release archives and SBOMs
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Attest published container image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/digests.txt
