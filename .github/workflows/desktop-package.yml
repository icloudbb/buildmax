# Packages the Wails desktop app on the platforms that can produce one.
#
# Nothing else in CI does. `go build ./...` compiles the desktop packages
# through desktop/assets_stub.go, the `!desktop` half of the build tag, and the
# frontend job in ci.yml builds desktop/dist without ever embedding it. So the
# `desktop` tag path, cmd/buildmax-desktop/wails.json, and the native link
# against WebKit and WebView2 had no coverage at all: a break in any of them
# surfaced when a contributor next ran `./make build`, which could be weeks.
#
# Path-filtered on pull requests. Moving end-to-end suites off the pull-request
# gate was about suites that need containers, a cluster, or a browser; this is a
# compile, it runs only when the app's own inputs change, and catching a broken
# build before the merge beats catching it after. It also runs after merge,
# weekly, and on demand.
#
# After building, it launches the packaged app and requires it to stay up
# briefly (`./make e2e desktop-launch`) — a build proves it compiles, this proves
# the bundle starts, catching a crash on launch a build never sees. The launched
# binary is the locally built one, so Gatekeeper's download quarantine does not
# apply.
#
# It builds and does not publish. Publishing is desktop-release.yml's job, gated
# on a version tag; this one is the pull-request check that the bundle still
# builds and starts. It does not upload its output as a workflow artifact: a
# downloaded unsigned macOS bundle is held by Gatekeeper, and the point here is
# the build result, not a download to hand out.
name: Desktop package

# The two path lists are duplicated rather than shared through a YAML anchor:
# the Actions workflow parser does not resolve anchors, so one would silently
# leave a trigger with no filter at all.
on:
  pull_request:
    paths:
      - 'cmd/buildmax-desktop/**'
      - 'desktop/**'
      - 'gui/**'
      - 'internal/interface/desktop/**'
      - 'tools/mk/build.go'
      - 'go.mod'
      - 'go.sum'
      - '.node-version'
      - '.github/workflows/desktop-package.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/buildmax-desktop/**'
      - 'desktop/**'
      - 'gui/**'
      - 'internal/interface/desktop/**'
      - 'tools/mk/build.go'
      - 'go.mod'
      - 'go.sum'
      - '.node-version'
      - '.github/workflows/desktop-package.yml'
  schedule:
    # Weekly. The inputs change rarely; what this catches between merges is
    # drift underneath — a runner image, a WebView runtime, a toolchain.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request, one per commit elsewhere. A superseded pull
  # request run is worth cancelling; a run on main is not, because there the ref
  # is constant and cancelling would let a second merge discard the first one's
  # result and leave that commit unproved -- the lesson deployment-smoke.yml
  # records.
  group: desktop-package-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms report, rather than the second being cancelled by the
      # first: "it builds on macOS and not on Windows" is the finding.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            desktop/frontend/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.17.0

      # Through the task runner, so the shim and tools/mk are covered with it.
      # `build desktop` builds gui first, which the desktop frontend consumes
      # through a file: dependency.
      - name: Package the desktop app
        if: runner.os != 'Windows'
        run: ./make build desktop

      # shell is explicit because the matrix hides the runner OS from workflow
      # linters, which then read a batch invocation as a bash script.
      - name: Package the desktop app
        if: runner.os == 'Windows'
        shell: cmd
        run: .\make.bat build desktop

      # A build proves it compiles; this proves the bundle starts. Launches the
      # packaged app and requires it to stay up briefly, catching a crash on
      # launch a build never sees.
      - name: Launch smoke
        if: runner.os != 'Windows'
        run: ./make e2e desktop-launch

      - name: Launch smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: .\make.bat e2e desktop-launch
