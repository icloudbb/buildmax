name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    env:
      # An explicit GOBIN, so the cached path below is exactly where `go install`
      # writes rather than wherever GOPATH resolves to on the runner. Guessing
      # wrong there would cache an empty directory and silently reinstall every
      # tool on every run. The leading dot keeps it out of `./...`.
      GOBIN: ${{ github.workspace }}/.ci-tools
      # Tool versions are pinned here rather than at each call site so that the
      # tool cache key below invalidates on a bump instead of serving a stale
      # binary.
      ACTIONLINT_VERSION: v1.7.12
      GITLEAKS_VERSION: v8.30.1
      GOLANGCI_LINT_VERSION: v2.12.2
      GOVULNCHECK_VERSION: v1.7.0
      GO_LICENSES_VERSION: v1.6.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-go keys its cache on go.sum alone, so every Linux job here shared
      # one entry and whichever finished first saved it -- the light policy job,
      # which left this one, the heaviest, compiling everything from cold. This
      # job keeps its own entry instead.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Restored on every run, written only from main, and keyed on the
      # toolchain rather than the commit: this entry measured 1035 MB, and one
      # per commit would have filled the repository's shared 10 GB budget in
      # days and evicted the entries the other jobs depend on. Keying it on
      # go.mod and go.sum holds exactly one, refreshed when the dependencies or
      # the Go version move. What that leaves stale is this module's own
      # packages, which any source change recompiles regardless; the compiled
      # dependencies and the race-instrumented standard library are the bulk of
      # what the cache is for, and those move with go.sum.
      - name: Restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      # These tools live outside this module, so the module cache never held
      # them and `go run pkg@version` re-downloaded and recompiled each one on
      # every run -- 184 module downloads in the lint step alone. Install them
      # once and cache the binaries.
      - name: Cache Go tools
        id: go-tools-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ci-tools
          key: go-tools-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ env.ACTIONLINT_VERSION }}-${{ env.GITLEAKS_VERSION }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ env.GO_LICENSES_VERSION }}

      - name: Install Go tools
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "github.com/google/go-licenses@$GO_LICENSES_VERSION"

      - name: Put Go tools on PATH
        run: echo "$GOBIN" >> "$GITHUB_PATH"

      # gofmt walks the filesystem, not the module, so `gofmt -l .` also reads
      # node_modules once anyone has run npm install. Formatting npm-shipped Go
      # sources is not this repository's business; tracked files are.
      - name: Check formatting
        run: |
          unformatted=$(git ls-files '*.go' -z | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: git ls-files '*.go' -z | xargs -0 gofmt -w"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check GitHub Actions workflows
        run: actionlint

      # Only the history this commit carries: with fetch-depth 0 every branch is
      # fetched, and scanning them all let any open branch fail every other PR.
      # A branch's own commits are scanned by its own CI run.
      - name: Scan Git history for secrets
        run: gitleaks git --redact --no-banner --exit-code 1 --log-opts=HEAD

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Configuration and rationale: .golangci.yml.
      - name: Lint
        run: golangci-lint run ./...

      # Known vulnerabilities in the Go toolchain and in dependencies this code
      # actually calls. Reachability-based, so it fails only on code paths that
      # exist here.
      - name: Check for known vulnerabilities
        run: govulncheck ./...

      # -race here and not on Windows: the agent runtime, the scheduler, and the
      # websocket hub are all concurrent, and this is the job that exercises
      # them on the platform CI trusts most.
      - name: Test
        env:
          # Tests write their data directory here instead of ~/.buildmax.
          BUILDMAX_HOME: ./testing-sandbox
        run: go test -race ./...

      # Fails on copyleft that would conflict with redistributing under
      # Apache-2.0. See docs/contribute/dependency-licenses.md.
      - name: Check dependency licenses
        run: go-licenses check ./cmd/... --disallowed_types=forbidden,restricted

      - name: Save Go build cache
        if: github.event_name == 'push' && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  # The store tests skip themselves without a DSN, so the job above proves
  # nothing about schema, query, transaction, or MySQL-specific behavior — it
  # runs them and they opt out. That gap let a defect sit on main for 387
  # commits: CreateSpace returned a Space whose plugin_curation was "" while
  # GetSpace answered "open" for the same row, and the test that says so had been
  # skipping since the day it was written.
  #
  # A separate job because it needs a service container the rest do not, and
  # because a red "Persistence" is attributable at a glance. It restores the go
  # job's build cache but never saves one: two jobs writing the same key is how
  # the entry the heavier job depends on gets evicted.
  #
  # See docs/design/verification-program.md §4.
  mysql:
    name: Persistence (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        # The version the deployment manifests run (deployment/kind/mysql.yaml).
        # Testing persistence against a different server than production uses
        # would answer a question nobody asked.
        image: mysql:8.0
        env:
          # An ephemeral container on the runner's own network, reachable by
          # nothing else for the length of one job. root because the scope
          # creates and drops a database of its own, which a single-schema
          # grant cannot do.
          MYSQL_ROOT_PASSWORD: buildmax
          MYSQL_DATABASE: buildmax
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbuildmax"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      # The same command a contributor runs. It requires the DSN rather than
      # skipping without one, runs on a uniquely named database it creates and
      # drops, and fails if a test in the scope skips for want of the DSN
      # anyway — so this job cannot go green by testing nothing.
      - name: Test against MySQL
        env:
          BUILDMAX_TEST_DSN: root:buildmax@tcp(127.0.0.1:3306)/buildmax
        run: ./make test mysql

  frontend:
    name: Frontend (gui, portal, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            portal/package-lock.json
            desktop/frontend/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.17.0

      # portal depends on @buildmax/gui via a file: link, so gui builds first.
      # gui has no ESLint step: typescript-eslint does not support the
      # TypeScript 7 it builds with, and its own build type-checks it.
      - name: Build gui
        working-directory: gui
        run: |
          npm ci
          npm run build
          npm test

      - name: Build portal
        working-directory: portal
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - name: Build desktop frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - name: Verify installs leave lockfiles unchanged
        run: git diff --exit-code

  open-source-policy:
    name: Open source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node for markdownlint; Go because the license check is a tools/mk task and
      # reads the lockfiles directly rather than through npm.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Use pinned npm
        run: npm install --global npm@11.17.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint Markdown
        run: npm exec --yes --package=markdownlint-cli2@0.23.2 -- markdownlint-cli2

      - name: Check npm production dependency licenses
        run: go run ./tools/mk release licenses

  # Deployment and browser E2E run after merge, not here: they need a stack, and
  # putting one in front of every pull request was judged too slow. The cost of
  # that choice is that a break only appears once it is already on main, and the
  # policy covering it — the author of the breaking merge triages it the same
  # day — turned out to hold for exactly as long as someone was watching. It
  # went red on a merge and stayed red through four more, none of which had any
  # reason to notice.
  #
  # So the red state is what stops the next merge. This does not verify the pull
  # request in front of it; it refuses to add to a main whose last verification
  # failed, which is the pressure the written policy assumed and never had.
  #
  # See docs/design/end-to-end-testing.md §8.
  deployment-smoke-health:
    name: Deployment smoke health
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Refuse to merge onto an unverified main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # A pull request whose purpose is to repair the suite has to be able
          # to land while it is still red. The label is the deliberate act that
          # says so, and it is visible on the pull request rather than buried in
          # a commit message.
          BYPASS: ${{ contains(github.event.pull_request.labels.*.name, 'deployment-smoke-fix') }}
        run: |
          set -euo pipefail
          if [ "$BYPASS" = "true" ]; then
            echo "Labelled deployment-smoke-fix: this pull request may land while main is red."
            exit 0
          fi
          run=$(gh api "repos/$REPO/actions/workflows/deployment-smoke.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] | "\(.conclusion)\t\(.html_url)\t\(.head_sha)\t\(.display_title)"' || true)
          conclusion=$(printf '%s' "$run" | cut -f1)
          url=$(printf '%s' "$run" | cut -f2)
          sha=$(printf '%s' "$run" | cut -f3)
          title=$(printf '%s' "$run" | cut -f4)
          # No run to read, or the API would not answer. Neither is evidence
          # that main is broken, and a gate that blocks on its own outage is a
          # worse problem than the one it guards.
          if [ -z "$conclusion" ] || [ "$conclusion" = "null" ]; then
            echo "No completed deployment smoke run on main to read; nothing to hold this back."
            exit 0
          fi
          if [ "$conclusion" = "success" ]; then
            echo "main's last deployment smoke passed: $url"
            exit 0
          fi
          {
            echo "### main is not verified"
            echo
            echo "Its last completed deployment smoke ended in \`$conclusion\`."
            echo
            echo "- Run: $url"
            echo "- Commit: \`$sha\` — $title"
            echo
            echo "Fix or revert that merge first. A pull request that repairs the"
            echo "suite carries the \`deployment-smoke-fix\` label and is let through."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "main's last deployment smoke ended in $conclusion: $url ($sha, $title)"
          exit 1
