<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildMax Portal</title>
  </head>
  <body>
    <script>
      (function(){var t=localStorage.getItem("buildmax_theme");if(t!=="dark"&&t!=="light")t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();
    </script>
    <div id="root"></div>
    <!-- Runtime config, replaced by the container entrypoint. Must load before
         the bundle: the first API call reads it. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
