# BuildMax local settings (BUILDMAX_HOME/settings.yaml)
# Used by the CLI and desktop app.

log_level: info

# Server URL shown as default when running `buildmax login`.
# server_url: http://localhost:5678  # BUILDMAX_SERVER_URL overrides this

# WebSearch works without a key while Firecrawl accepts keyless requests.
# web_search:
#   api_key: your-firecrawl-api-key

# LLM models available in the CLI and desktop app. The first entry is the
# default model. context_window: 0 uses the built-in default (32000 tokens).
#
# The entries below are a broad-compatibility baseline (OpenAI + Anthropic
# tiers, plus one model per other major lab), checked with `./make models
# info <model>` and kept current with `./make models check`. Swap in
# whatever you actually use — any OpenRouter model id works the same way.
#
# `pricing` (USD per million tokens) lets a run report what it cost; without
# it the run reports "unavailable" rather than guessing. Get current rates
# with `./make models info <model>`.

# Which model a new session starts with, by name or model id. Leave unset
# and the first entry is the default. Only applies when signed out — after
# `buildmax login` the deployment's own default takes over.
# default_model: GPT-5.6 Luna

models:
  - model: openai/gpt-5.6-luna
    name: GPT-5.6 Luna
    provider: openai
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 1050000
    # call_timeout: 300  # per-call timeout in seconds (default 300)
    pricing:
      currency: USD
      input_per_mtok: "0.2"
      cache_read_per_mtok: "0.02"
      cache_write_per_mtok: "0.25"
      output_per_mtok: "1.2"

  - model: openai/gpt-5.6-sol
    name: GPT-5.6 Sol
    provider: openai
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 1050000

  - model: openai/gpt-5.6-terra
    name: GPT-5.6 Terra
    provider: openai
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 1050000

  - model: anthropic/claude-haiku-4.5
    name: Claude Haiku 4.5
    provider: anthropic
    api_url: https://openrouter.ai/api/
    api_key: your-openrouter-api-key
    context_window: 200000
    pricing:
      currency: USD
      input_per_mtok: "1"
      cache_read_per_mtok: "0.1"
      cache_write_per_mtok: "1.25"
      output_per_mtok: "5"

  - model: anthropic/claude-sonnet-5
    name: Claude Sonnet 5
    provider: anthropic
    api_url: https://openrouter.ai/api/
    api_key: your-openrouter-api-key
    context_window: 1000000

  - model: anthropic/claude-opus-5
    name: Claude Opus 5
    provider: anthropic
    api_url: https://openrouter.ai/api/
    api_key: your-openrouter-api-key
    context_window: 1000000

  - model: google/gemini-3.7-flash
    name: Gemini 3.7 Flash
    provider: openai_compatible
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 1048576

  - model: x-ai/grok-4.6
    name: Grok 4.6
    provider: openai_compatible
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 500000

  - model: deepseek/deepseek-v4-flash
    name: DeepSeek V4 Flash
    provider: openai_compatible
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 1024000

  - model: z-ai/glm-5.3
    name: GLM 5.3
    provider: openai_compatible
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 1048576
    pricing:
      currency: USD
      input_per_mtok: "1.4"
      cache_read_per_mtok: "0.26"
      output_per_mtok: "4.4"

  - model: moonshotai/kimi-k3
    name: Kimi K3
    provider: openai_compatible
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 1048576

  - model: qwen/qwen3-max
    name: Qwen3 Max
    provider: openai_compatible
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 262144

  # `provider` is the wire protocol, not a vendor name:
  #   openai_compatible  OpenAI Chat Completions — OpenRouter, LiteLLM, vLLM,
  #                      LM Studio. The default.
  #   openai             the OpenAI Responses API
  #   anthropic          the Anthropic Messages API
  #   ollama             a local Ollama daemon's own API
  #
  # One gateway can speak several of them, which is why the entries above
  # reach one OpenRouter key three ways. Only anthropic supports explicit
  # prompt caching — Chat Completions has no field for it, so a Claude model
  # reached as openai_compatible never caches. api_url also differs: Messages
  # hangs off /api/, the other two off /api/v1.

  # Reaching Anthropic directly rather than through a gateway. Full field
  # rules: docs/reference/configuration.md.
  # - model: claude-sonnet-4-5
  #   name: Claude Sonnet 4.5
  #   provider: anthropic
  #   api_url: https://api.anthropic.com
  #   api_key: your-anthropic-api-key
  #   context_window: 200000
  #   max_tokens: 8192             # caps one response; 0 = built-in default (8192)
  #   reasoning: medium            # off (default) | low | medium | high; replays on later turns
  #   cache_control:
  #     mode: auto                 # auto (default) | off | force
  #     ttl: provider_default      # provider_default | 5m/1h (anthropic) | 24h (openai)
  #   integration: openrouter      # gateway cache behavior; none qualified yet, so refused today
  #   vision: true                 # accepts image input; off sends MCP images as text instead

  # Local model: no api_key needed. Use `provider: ollama`, not the daemon's
  # OpenAI-compatible endpoint — only the native API can set context_window;
  # otherwise the daemon applies its own default and silently truncates a
  # longer prompt, dropping the system prompt and tool definitions.
  #
  # `buildmax init --ollama` writes this entry for a model you already have;
  # `buildmax models --local` lists what the daemon holds and which of those
  # can call tools (required to be usable as an agent).

  - model: qwen3:8b
    name: Qwen3 8B (local)
    provider: ollama
    api_url: http://localhost:11434  # daemon root, not its /v1 endpoint
    context_window: 32000            # sent as num_ctx; costs memory to raise
    keep_alive: 30m                  # how long the daemon keeps it loaded (0 = unload, -1 = resident)

  # `buildmax login` switches this machine to that deployment's own model
  # catalog; `buildmax logout` switches back to the entries above.
  # See docs/design/client-modes.md.

# Bash sandbox: confines subprocesses started by the Bash tool by filesystem
# path and network domain. Read, Write, Edit, Glob, and Grep keep their own
# workspace-root boundary regardless.
#
# Disabled by default on every surface, including workers. Requires Seatbelt
# on macOS or bwrap on Linux/WSL2; unavailable on native Windows. Check with
# `buildmax sandbox deps` and `buildmax sandbox status`.
#
# An operator can override this block from <BUILDMAX_HOME>/policy.yaml, and
# BUILDMAX_SANDBOX_ENABLED overrides both.
#
# Guide: manual/sandbox.md. Design: docs/design/sandbox-boundaries.md.
#
# sandbox:
#   enabled: true
#   fail_if_unavailable: false          # true = refuse to run Bash rather than run it unsandboxed
#   auto_allow_bash_if_sandboxed: true  # sandboxed commands skip the approval prompt
#   allow_unsandboxed_commands: false   # gate for the per-call dangerously_disable_sandbox escape hatch
#   excluded_commands: []               # commands that never get sandboxed
#
#   filesystem:
#     allow_write: ["."]                # the workspace, and nothing else
#     deny_write:  ["~/.ssh", "~/.aws", "~/.buildmax"]
#     allow_read:  ["."]
#     deny_read:   ["~/.ssh", "~/.aws"]
#     allow_managed_read_paths_only: false   # true in policy.yaml ignores lower layers' allow_read
#
#   network:
#     allowed_domains: ["api.github.com", "proxy.golang.org", "registry.npmjs.org"]
#     denied_domains:  []
#     allow_local_binding: false        # let sandboxed processes bind localhost ports
#     allow_all_unix_sockets: false
#     allow_unix_sockets: []            # e.g. ["/var/run/docker.sock"] — grants real power, list deliberately
#     allow_managed_domains_only: false # true in policy.yaml ignores lower layers' allowed_domains
#     # Pin the Go-side egress proxy ports; omit both to pick free ports.
#     http_proxy_port: 0
#     socks_proxy_port: 0
#
#   # Bounds a sandboxed Bash command's own resource use. 0 = no limit from
#   # this layer. max_memory_mb has no effect on macOS, which does not
#   # support it at the OS level.
#   process:
#     max_cpu_seconds: 0
#     max_memory_mb: 0
#     max_processes: 0
#     max_open_files: 0
#
#   # Silence known-harmless violations instead of loosening the boundary.
#   ignore_violations:
#     read: ["/etc/ssl/**"]
#
#   # Escape hatches for constrained hosts (containers, nested sandboxes).
#   # Both weaken isolation — set them only when the strict mode cannot start.
#   enable_weaker_nested_sandbox: false
#   enable_weaker_network_isolation: false

# Runtime hooks (P0.5 trust harness): observe or block events in the agent
# loop. Full design: design/hook-system.md.
#
# Events (GATING can block, advisory only observes):
#   session_start:          session opened or resumed (advisory)
#   session_end:            session closed (advisory)
#   user_prompt_submit:     prompt entering the agent (GATING)
#   pre_tool_use:           before tool execution (GATING)
#   post_tool_use:          tool succeeded (advisory)
#   post_tool_use_failure:  tool returned an error (advisory)
#   notification:           approval needed / permission denied (advisory)
#   pre_compact:            before context compaction (GATING)
#   post_compact:           after context compaction (advisory)
#   subagent_start:         subagent started (advisory)
#   subagent_stop:          subagent finished (advisory)
#   stop:                   main agent finished (advisory)
#   stop_failure:           main agent finished with an error (advisory)
#   worktree_create:        a worktree was created and entered (advisory)
#   worktree_remove:        a worktree and its branch were removed (advisory)
#   cwd_changed:            the session's workspace root moved (advisory)
#
# Transport via "type" (default "command"):
#   command    run a shell command; HookInput JSON arrives on stdin
#   http       POST HookInput JSON to a URL
#   mcp_tool   invoke a tool on a connected MCP server
#   prompt     single-turn LLM call ($ARGUMENTS expands to the JSON payload)
#
# "matcher" is a regex on the tool name (Read, Write, Edit, Glob, Grep, Bash,
# WebFetch, TodoWrite, Skill, Task, LoadMcpTools, CallMcpTool) — only used by
# pre_tool_use, post_tool_use, and post_tool_use_failure; empty matches all.
# "timeout" is seconds (default 30).
#
# Block contract: command exit 2 = block (stderr → reason); HTTP 422 = block
# (body → reason); any transport may also return
# {"decision":"block","reason":"..."} JSON. Anything else fails open (allows).
#
# A per-workspace overlay at <workspace>/.buildmax/hooks.yaml extends this
# block; both layers run, additively (global first, then workspace).
#
# hooks:
#   user_prompt_submit:
#     # Project-shipped script that scans for forbidden content. Exit 2 to
#     # block; the LLM never sees the prompt.
#     - type: command
#       command: "./.buildmax/hooks/redact.sh"
#       timeout: 5
#
#   pre_tool_use:
#     # Centralized HTTP policy service. A 200 with
#     # {"decision":"block","reason":"..."} denies the call.
#     - type: http
#       matcher: "Bash|Write|Edit"
#       url: "https://policy.internal/check"
#       headers:
#         Authorization: "Bearer $POLICY_TOKEN"
#       allowed_env: [POLICY_TOKEN]   # only listed env vars are interpolated
#       timeout: 5
#
#     # LLM-based judge. Prefer the cheapest model — this fires on every tool
#     # call. Returning {"decision":"block","reason":"..."} blocks.
#     - type: prompt
#       matcher: "Bash"
#       model: ""                      # empty = default model from this file
#       prompt: |
#         You are reviewing a tool call. Reply with one JSON object:
#         {"decision":"allow"|"block","reason":"..."}
#         Call:
#         $ARGUMENTS
#
#   post_tool_use:
#     # Formatter — always allows, just runs after Write/Edit.
#     - type: command
#       matcher: "Write|Edit"
#       command: "gofmt -w ."
#
#   post_tool_use_failure:
#     # Forward tool failures to an MCP-backed audit service.
#     - type: mcp_tool
#       server: "audit"
#       tool: "record_failure"
#       input:
#         tool: "${tool_name}"
#         error: "${tool_error}"
#         path: "${tool_args.path}"
#
#   notification:
#     - type: command
#       command: "./.buildmax/hooks/notify-desktop.sh"
#
#   stop:
#     - type: command
#       command: "/usr/local/bin/audit.sh"

# Tool permissions. BuildMax asks before a tool call that changes something,
# on surfaces where somebody can answer — the CLI TUI and Desktop. Print
# mode, workers, and Portal conversations raise no prompt of their own.
# "ask" refused where there's no human to ask, rather than run.
#
# Answer a prompt with `a` to allow that tool for the rest of the session
# without writing anything here.
#
# Actions: allow | ask | deny. A key is a tool name, or a tool plus the
# target it dispatches to, with an optional trailing "*". The most specific
# rule wins. "allow" turns off the category prompt, not the safety checks —
# reading a sensitive path or running a risky shell command still prompts;
# only "deny" outranks those. Full design: design/tool-permissions.md.
#
# tools:
#   permissions:
#     Write: allow                        # stop asking before file writes
#     Edit: allow
#     Task: ask                           # the default for a writing tool
#     Bash: deny                          # no shell at all
#     "CallMcpTool:github/*": allow       # trust one server's tools
#     "CallMcpTool:jira/delete_issue": deny

# Agent loop tuning.
#
# max_parallel_tools bounds how many tool calls from one model message run
# concurrently. Only calls a tool declares read-only ever overlap — writes,
# shell commands, and MCP calls always run alone and in order. 1 disables
# parallel execution. Range 1-16, default 4.
#
# max_iterations bounds how many model calls one prompt may make before the
# run stops with "max iterations exceeded" (whatever was already written
# stays written). Range 1-5000, default 200. `buildmax --max-iterations N`
# overrides it for a single run.
#
# turn_digest spends one small extra model call when a turn ends: recap
# prints a dim summary under the reply, suggest offers a likely next answer
# as ghost text (tab accepts). Neither re-enters the conversation. Both
# default to true.
#
# agent:
#   max_parallel_tools: 4
#   max_iterations: 200
#   turn_digest:
#     recap: true
#     suggest: true
