# BuildMax server configuration (BUILDMAX_HOME/server.yaml)
# Copy to BUILDMAX_HOME/server.yaml and fill in your values.
# Secret-bearing fields can be overridden by the BUILDMAX_* variables documented
# in docs/reference/configuration.md.

log_level: info
port: 5678

# JWT signing secret for auth tokens.
# Production: leave blank here and inject via BUILDMAX_JWT_SECRET env var.
# Local dev: set directly.
jwt_secret: your-jwt-secret-here

# Who may create an account. Closed by default — an operator creates accounts
# on the server:
#
#   buildmax-server user create alice@example.com
#   buildmax-server user login-code alice@example.com
#
# The second command prints a single-use code (valid an hour, that account
# only), which the person redeems and then sets a password from account
# settings — also how a forgotten password gets reset. Deliver the code
# however you already talk to them; BuildMax has no mail channel.
#
# Setting this to true lets anyone who can reach the server register.
# allow_signup: true

# Token lifetimes. Signing in returns an access token (sent with every request;
# not stored, but the server checks the session it names on every request, so
# revocation and disablement take effect within this window) and a refresh token
# (a database row). Each exchange rotates the refresh token; presenting a spent
# one revokes the whole session — that's how a copied credential is noticed.
# Keep the access token short: it is the maximum replay window.
access_token_ttl: 15m
refresh_token_ttl: 720h

# Grace window for reusing a just-rotated refresh token before it counts as
# reuse. Needed because the CLI and Desktop share one credentials file and
# may both refresh at once. Raising it widens the window in which a stolen
# token goes unnoticed.
refresh_rotation_grace: 30s

# Hard ceiling on a session's life from its creation, regardless of how often
# its refresh token rotates — so a login cannot renew forever. Reaching it
# requires signing in again.
session_absolute_ttl: 2160h

# Budget for an orderly shutdown: leave the load balancer, end run-watching
# streams, let in-flight runs report their results, drain accepted requests,
# stop background loops. Must stay below whatever force-kills the process if
# it's slow (terminationGracePeriodSeconds on Kubernetes, TimeoutStopSec
# under systemd), or the shutdown gets interrupted partway through.
shutdown_grace: 25s

cors_origin: http://localhost:5173
# The externally reachable origin at which people open BuildMax (the Portal, or
# the shared origin behind a reverse proxy). Artifact public share links are
# built from it. Leave empty to keep public sharing off — the server refuses to
# create a link it cannot make openable rather than emitting an internal URL.
# Also settable with BUILDMAX_PUBLIC_BASE_URL.
public_base_url: ""
workspaces_dir: /data/buildmax/workspaces
default_quota_tier: free_trial

# Tier 1 conversation LLM used by the portal agent loop.
conversation:
  model:
    model: openai/gpt-4o
    name: GPT-4o
    api_url: https://openrouter.ai/api/v1
    api_key: your-openrouter-api-key
    context_window: 128000
    call_timeout: 300            # per-call timeout in seconds (0 = default 300)
    # provider: openai_compatible  # openai_compatible (default) | openai (Responses API)
                                   # | anthropic | ollama (local daemon, no api_key;
                                   # api_url must be reachable from the server)
    # max_tokens: 0                # cap on one response; 0 = the adapter default
    # reasoning: off               # off (default), low, medium, or high
    # cache_control:               # prompt cache policy for this model
    #   mode: auto                 #   auto (default), off, force
    #   ttl: provider_default      #   provider_default (default), 5m, 1h
    # pricing:                     # what this model charges; without it a call
    #   currency: USD              # reports its cost as unavailable
    #   input_per_mtok: "3.00"
    #   cache_read_per_mtok: "0.30"
    #   cache_write_per_mtok: "3.75"
    #   output_per_mtok: "15.00"
    # vision: false                # this model accepts image input

  # Use a catalog model for Tier 1 instead of the model above. Accepts either
  # the llm_model ID or the --name it was added with — the name is what you can
  # write down before the row's runtime ID exists. Leave unset to use
  # conversation.model. BUILDMAX_CONVERSATION_MODEL_TARGET overrides it, so one
  # image can point Tier 1 at a seeded model without rewriting this file.
  # model_target: "Claude Sonnet 5"

# Space model policy for the managed LLM gateway. The catalog itself lives in
# the llm_model database table, not here, since it holds provider credentials
# and changes at runtime:
#
#   buildmax-server model add --name Fast \
#       --api-url https://openrouter.ai/api/v1 \
#       --api-key your-openrouter-api-key \
#       --model openai/gpt-4o-mini --context-window 128000
#   buildmax-server model list
#
# A local runtime is a target like any other, minus the credential:
#
#   buildmax-server model add --name "Local Qwen" --provider ollama \
#       --api-url http://host.docker.internal:11434 \
#       --model qwen3:8b --context-window 32000
#
# Every catalog model is available to every user of this deployment — space is
# a collaboration boundary, not a model authorization boundary. A client
# names a model by the --name it was added with.
#
# This block only picks which model a caller gets when it names none; leaving
# it out uses the first enabled catalog model, so a single-model deployment
# needs nothing here. A name not in the catalog stops the server at startup.
# BUILDMAX_LLM_DEFAULT_MODEL overrides it. See docs/design/client-modes.md.
# llm:
#   default_model: Fast          # a --name from `model list`

database:
  host: localhost
  port: 3306
  user: buildmax
  password: buildmax
  name: buildmax
  # go-sql-driver tls mode. Unset = "preferred" (TLS when offered, cert not
  # verified). "true" requires TLS and verifies against system roots — use
  # this for a managed database (RDS, Aurora, Cloud SQL). "skip-verify"
  # requires TLS but accepts any cert; "false" never uses it.
  tls: ""

webhook:
  message_path: message
  user_id: webhook

worker:
  binary: buildmax-worker
  run_mode: local_process   # or k8s_job
  # Where a worker reaches this server. It is the worker control listener
  # (worker_api.listen below), NOT the public port: /api/worker/* lives only on
  # that listener now. On one host that is loopback; on Kubernetes it is the
  # internal worker Service, e.g.
  # https://buildmax-worker-api.buildmax.svc.cluster.local:5679.
  # BUILDMAX_SERVER_URL overrides this.
  server_url: http://127.0.0.1:5679

  # Plain HTTP to the server is a development-only mode (local_process, Compose,
  # kind). A k8s_job with an http:// server_url is refused unless this is true,
  # because .cluster.local and loopback are routing facts, not confidentiality.
  allow_insecure_http: true
  # The CA the worker verifies the worker listener's certificate against. Empty
  # uses the system trust roots. On Kubernetes this is a read-only mount.
  server_ca_file: ""
  # Optional native mTLS: a client certificate the worker presents in addition
  # to its run token. Both or neither. Only useful where a platform issues
  # per-pod identities; the run token is still the mandatory authentication.
  client_cert_file: ""
  client_key_file: ""

  # How a task run reaches a model. "direct" (default): the worker calls a
  # provider itself with conversation.model and its api_key. "buildmax": the
  # run calls this server's managed gateway with a per-run credential and no
  # provider key ever reaches the worker. BUILDMAX_WORKER_LLM_TRANSPORT
  # overrides this, so one image flips a run between the two by environment
  # alone; the server reads it and tells each worker its transport per run.
  #
  # The model name is the only model identity a run gets — endpoint, upstream
  # model, and credential all stay on the server. Leave empty to use
  # llm.default_model.
  llm:
    transport: direct          # or buildmax
    model: ""                  # e.g. Fast
    context_window: 0
    call_timeout: 0            # per-call timeout in seconds (0 = client default)

  # How long a run's credential stays valid. Every run gets one (used on its
  # own API routes, not just the gateway) and it's not renewable, so it must
  # outlast the run — a run that outlives its token can no longer report
  # anything, including its own result.
  run_token_ttl: 24h

  # How long a run may stay SCHEDULED or RUNNING before the server marks it
  # abandoned. Only the worker moves a run out of those states, so without
  # this a run whose worker died stays open forever. Keep it at or below
  # run_token_ttl — a run that outlived its credential can never report an
  # outcome anyway.
  run_timeout: 6h

  k8s:
    namespace: buildmax
    image: buildmax:local
    # ConfigMap holding a server.yaml key, mounted into every worker pod so
    # it reads the same configuration as the server. Empty falls back to
    # built-in defaults — almost never what you want.
    config_map: buildmax-config
    # ConfigMap holding the worker-api CA certificate, mounted read-only into
    # every worker pod at worker.server_ca_file so the worker verifies the
    # server listener. Empty mounts none (system roots, or plain HTTP dev).
    ca_config_map: ""
    home_dir: /buildmax          # BUILDMAX_HOME inside a worker pod
    # Worker pods run root with every Linux capability dropped except
    # SYS_ADMIN, a Localhost seccomp profile, and an Unconfined AppArmor
    # profile — not configurable, since a worker runs model-chosen shell
    # commands. See docs/reference/configuration.md's "How A Worker Pod Is
    # Confined" for why.
    # Kubernetes quantity strings, all required under k8s_job: the server
    # refuses to start rather than schedule a pod that model-chosen commands
    # could run unbounded. Starting points, not measurements — a build or
    # test suite needs considerably more than an agent answering a question.
    resources:
      cpu_request: 500m
      cpu_limit: "2"
      memory_request: 1Gi
      memory_limit: 4Gi
      ephemeral_storage_request: 2Gi
      ephemeral_storage_limit: 20Gi

# The internal listener that serves the worker control API (/api/worker/*),
# kept off the public HTTP surface so a broad public Ingress rule cannot expose
# it and a Kubernetes NetworkPolicy can admit only worker pods to it. See
# docs/design/worker-api-network-boundary.md.
worker_api:
  # Bind address. Loopback by default so an accidental deployment opens no new
  # unauthenticated cluster port; a Kubernetes deployment sets 0.0.0.0:5679 and
  # fronts it with the buildmax-worker-api Service. It must not share the
  # public port.
  listen: 127.0.0.1:5679
  # Server certificate for the worker listener. Empty cert and key serve plain
  # HTTP (development only, alongside worker.allow_insecure_http). In production
  # this is the internal Service DNS name's certificate, mounted only into
  # server pods.
  tls:
    cert_file: ""
    key_file: ""
    # Optional native mTLS: when set, the listener also requires a client
    # certificate this CA issued, in addition to the run token.
    client_ca_file: ""

# Governance trail retention. 0 (default) keeps every event forever — a
# deployment that hasn't chosen a retention policy hasn't decided to discard
# evidence. Setting a window starts an hourly sweep; each sweep that removed
# anything records an audit.pruned event naming the range and count. Nothing
# else deletes an audit event, and no interface can delete a single one.
audit:
  retention_days: 0

# Durable run-trace retention. 0 (default) keeps every trace forever, for the
# same reason the audit trail does — traces are diagnostic evidence. Setting a
# window starts an hourly sweep that, for each run whose trace is older, deletes
# the trace object, clears the run's pointer to it, and records a traces.pruned
# audit event naming the range and count. A pruned run then reports that it has
# no trace rather than failing to load one.
trace:
  retention_days: 0

# Cross-replica coordination. Live server state — streamed deltas, connection
# events, and conversation turn serialization — is process-local by default, so
# the default mode is correct only for a single server replica. Run more than one
# replica only with mode: redis, backed by a Redis every replica shares.
# See docs/design/server-coordination.md.
coordination:
  mode: local   # or: redis
  redis:
    address: redis:6379   # host:port; required when mode is redis
    username: ""          # optional, for a Redis 6+ ACL user
    # password comes from BUILDMAX_COORDINATION_REDIS_PASSWORD, not this file
    password: ""
    db: 0                 # logical database number
    tls: false            # dial Redis over TLS

storage:
  persist_backend: local_fs   # or minio
  artifact_backend: local_fs  # or minio
  # Largest single artifact this deployment accepts, in MB (a per-file limit,
  # not a space storage allowance). 0 uses the built-in default. The allowance
  # is per space and lives in its quota tier, as max_storage_bytes.
  max_artifact_mb: 0
  # How long a deleted artifact's bytes stay in the bucket after the delete.
  # 0, the default, reclaims them on the next hourly retention sweep — the
  # artifact is already unreachable the moment it is deleted. Set a number of
  # days only to give your bucket's own tooling a window to recover from;
  # BuildMax itself offers no undelete.
  artifact_purge_after_days: 0
  # Default and maximum lifetime of a public artifact share link, in hours. A
  # create request may ask for less, never more. 0 uses the built-in default
  # (30 days). Requires public_base_url to be set for sharing to work at all.
  artifact_share_ttl_hours: 0
  # How long an uncommitted checkpoint payload stays in the store before the
  # orphan sweep reclaims it — bytes a worker uploaded whose pointer never
  # committed. 0, the default, reclaims on the next hourly sweep once the payload
  # is older than the cutoff, which is safe because bytes are written before the
  # pointer. Set a number of days to give an operator a recovery window first.
  checkpoint_orphan_grace_days: 0
  minio:
    # Set endpoint for an S3-compatible store you run (MinIO, Ceph, a
    # vendor's service). Leave empty for AWS S3 to let the SDK resolve the
    # regional endpoint itself.
    endpoint: http://localhost:9000
    region: us-east-1
    # Leave both keys empty to use the SDK's default credential chain — how a
    # pod reaches a bucket via IRSA, workload identity, or an instance
    # profile instead of a long-lived key.
    access_key: minio
    secret_key: minio123
    bucket: bmstore
    prefix: workspaces
    # Bucket addressing. Unset derives it from endpoint (set = compatible
    # store needing bucket-in-path, empty = AWS S3 which doesn't). Set only
    # for a compatible store that uses virtual-host addressing.
    # path_style: true

# Space Secrets: a Space-owned group of named items, sealed with envelope
# encryption. See docs/design/space-secrets.md.
secret:
  # Path to the key file that wraps every secret's data key. The key material
  # is never in this file or the environment -- only this path is. The file
  # holds a set of KEKs plus a pointer to the one new writes use, so a KEK can
  # be rotated without re-encrypting stored values. Empty disables the feature:
  # an agent that consumes a Secret is then refused, the same way naming a
  # plugin is refused with no Marketplace.
  kek_file: ""
